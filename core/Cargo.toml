[package]
name = "engine"
version = "0.1.0"
edition = "2021"
description = "Agent-native LLM inference engine: per-session KV cache that survives tool calls."
license = "MIT"

[dependencies]
candle-core = { git = "https://github.com/guoqingbao/candle.git", rev = "8ac335c" }
candle-nn = { git = "https://github.com/guoqingbao/candle.git", rev = "8ac335c" }
attention-rs = { git = "https://github.com/guoqingbao/attention.rs.git", rev = "3c258f0" }
tokenizers = "0.21.2"
hf-hub = "0.4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tiny_http = "0.12"
minijinja-contrib = { version = "2", features = ["pycompat"] }
minijinja = { version = "2", features = ["builtins", "json", "loop_controls"] }

[features]
default = []
# metal-flash matches xinfer's tested Metal path (flat NHD KV cache, BF16/F16 only).
metal = ["candle-core/metal", "candle-nn/metal", "attention-rs/metal", "attention-rs/metal-flash"]
cuda = ["candle-core/cuda", "candle-nn/cuda", "attention-rs/cuda"]
flashinfer = ["cuda", "attention-rs/flashinfer"]
